[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tradovate-client"
version = "0.1.0"
description = "A Tradovate API client for Python: token renewal, every order type, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "QuantQJ" }]
keywords = ["tradovate", "futures", "trading", "broker", "api", "cme"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
socket = ["websocket-client>=1.6"]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/QuantQJ/tradovate-client"
Source = "https://github.com/QuantQJ/tradovate-client"
Issues = "https://github.com/QuantQJ/tradovate-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tradovate_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
